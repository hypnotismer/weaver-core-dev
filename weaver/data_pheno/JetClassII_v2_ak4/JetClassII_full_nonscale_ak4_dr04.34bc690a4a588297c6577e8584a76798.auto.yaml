treename: null
selection: (jet_pt > 15) & (jet_pt < 1000) & (np.abs(jet_eta) < 5) & (jet_label <
  23)
test_time_selection: null
preprocess:
  method: manual
  data_fraction: 0.5
  params: null
new_variables:
  part_mask: ak.ones_like(part_energy)
  part_pt: np.hypot(part_px, part_py)
  part_pt_log: np.log(part_pt)
  part_e_log: np.log(part_energy)
  part_logptrel: np.log(part_pt/jet_pt)
  part_logerel: np.log(part_energy/jet_energy)
  part_deltaR: np.hypot(part_deta, part_dphi)
  part_d0: np.tanh(part_d0val)
  part_dz: np.tanh(part_dzval)
  label_B: (((jet_label >= 0) & (jet_label < 2)) | (jet_label == 17))
  label_C: (((jet_label >= 2) & (jet_label < 4)) | (jet_label == 18))
  label_S: (((jet_label >= 4) & (jet_label < 6)) | (jet_label == 19))
  label_D: (((jet_label >= 6) & (jet_label < 8)) | (jet_label == 20))
  label_U: (((jet_label >= 8) & (jet_label < 10)) | (jet_label == 21))
  label_G: ((jet_label == 10) | (jet_label == 22))
  label_e: ((jet_label >= 11) & (jet_label < 13))
  label_m: ((jet_label >= 13) & (jet_label < 15))
  label_tauh: ((jet_label >= 15) & (jet_label < 17))
  truth_label: jet_label
inputs:
  pf_points:
    length: 128
    pad_mode: wrap
    vars:
    - - part_deta
      - null
    - - part_dphi
      - null
  pf_features:
    length: 128
    pad_mode: wrap
    vars:
    - - part_pt_log
      - 1.7
      - 0.7
    - - part_e_log
      - 2.0
      - 0.7
    - - part_logptrel
      - -4.7
      - 0.7
    - - part_logerel
      - -4.7
      - 0.7
    - - part_deltaR
      - 0.2
      - 4.0
    - - part_charge
      - null
    - - part_isChargedHadron
      - null
    - - part_isNeutralHadron
      - null
    - - part_isPhoton
      - null
    - - part_isElectron
      - null
    - - part_isMuon
      - null
    - - part_d0
      - null
    - - part_d0err
      - 0
      - 1
      - 0
      - 1
    - - part_dz
      - null
    - - part_dzerr
      - 0
      - 1
      - 0
      - 1
    - - part_deta
      - null
    - - part_dphi
      - null
  pf_vectors:
    length: 128
    pad_mode: wrap
    vars:
    - - part_px
      - null
    - - part_py
      - null
    - - part_pz
      - null
    - - part_energy
      - null
  pf_mask:
    length: 128
    pad_mode: constant
    vars:
    - - part_mask
      - null
labels:
  type: custom
  value:
    truth_label: jet_label
observers:
- jet_pt
- jet_eta
- jet_phi
- jet_energy
- jet_nparticles
- jet_mass
monitor_variables: []
weights:
