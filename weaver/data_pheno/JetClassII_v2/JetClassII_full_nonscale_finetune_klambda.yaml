# to distinguish three k_lambda senarios in ggHH datasets

selection:
   ### use `&`, `|`, `~` for logical operations on numpy arrays
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   (fj_1_pt > 200) & (fj_2_pt > 200)

new_variables:
   ### [format] name: formula
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   fj_1_part_mask: ak.ones_like(fj_1_part_energy)
   fj_1_part_pt: np.hypot(fj_1_part_px, fj_1_part_py)
   fj_1_part_pt_log: np.log(fj_1_part_pt)
   fj_1_part_e_log: np.log(fj_1_part_energy)
   fj_1_part_logptrel: np.log(fj_1_part_pt/fj_1_pt)
   fj_1_part_logerel: np.log(fj_1_part_energy/fj_1_energy)
   fj_1_part_deltaR: np.hypot(fj_1_part_deta, fj_1_part_dphi)
   fj_1_part_d0: np.tanh(fj_1_part_d0val)
   fj_1_part_dz: np.tanh(fj_1_part_dzval)
   fj_2_part_mask: ak.ones_like(fj_2_part_energy)
   fj_2_part_pt: np.hypot(fj_2_part_px, fj_2_part_py)
   fj_2_part_pt_log: np.log(fj_2_part_pt)
   fj_2_part_e_log: np.log(fj_2_part_energy)
   fj_2_part_logptrel: np.log(fj_2_part_pt/fj_2_pt)
   fj_2_part_logerel: np.log(fj_2_part_energy/fj_2_energy)
   fj_2_part_deltaR: np.hypot(fj_2_part_deta, fj_2_part_dphi)
   fj_2_part_d0: np.tanh(fj_2_part_d0val)
   fj_2_part_dz: np.tanh(fj_2_part_dzval)

preprocess:
  ### method: [manual, auto] - whether to use manually specified parameters for variable standardization
  method: manual
  ### data_fraction: fraction of events to use when calculating the mean/scale for the standardization
  data_fraction: 0.5

inputs:
   fj_1_pf_points:
      length: 128
      pad_mode: wrap
      vars: 
         - [fj_1_part_deta, null]
         - [fj_1_part_dphi, null]
   fj_1_pf_features:
      length: 128
      pad_mode: wrap
      vars: 
      ### [format 1]: var_name (no transformation)
      ### [format 2]: [var_name, 
      ###              subtract_by(optional, default=None, no transf. if preprocess.method=manual, auto transf. if preprocess.method=auto), 
      ###              multiply_by(optional, default=1), 
      ###              clip_min(optional, default=-5), 
      ###              clip_max(optional, default=5), 
      ###              pad_value(optional, default=0)]
         - [fj_1_part_pt_log, 1.7, 0.7]
         - [fj_1_part_e_log, 2.0, 0.7]
         - [fj_1_part_logptrel, -4.7, 0.7]
         - [fj_1_part_logerel, -4.7, 0.7]
         - [fj_1_part_deltaR, 0.2, 4.0]
         - [fj_1_part_charge, null]
         - [fj_1_part_isChargedHadron, null]
         - [fj_1_part_isNeutralHadron, null]
         - [fj_1_part_isPhoton, null]
         - [fj_1_part_isElectron, null]
         - [fj_1_part_isMuon, null]
         - [fj_1_part_d0, null]
         - [fj_1_part_d0err, 0, 1, 0, 1]
         - [fj_1_part_dz, null]
         - [fj_1_part_dzerr, 0, 1, 0, 1]
         - [fj_1_part_deta, null]
         - [fj_1_part_dphi, null]
   fj_1_pf_vectors:
      length: 128
      pad_mode: wrap
      vars: 
         - [fj_1_part_px, null]
         - [fj_1_part_py, null]
         - [fj_1_part_pz, null]
         - [fj_1_part_energy, null]
   fj_1_pf_mask:
      length: 128
      pad_mode: constant
      vars: 
         - [fj_1_part_mask, null]
   fj_2_pf_points:
      length: 128
      pad_mode: wrap
      vars: 
         - [fj_2_part_deta, null]
         - [fj_2_part_dphi, null]
   fj_2_pf_features:
      length: 128
      pad_mode: wrap
      vars: 
      ### [format 1]: var_name (no transformation)
      ### [format 2]: [var_name, 
      ###              subtract_by(optional, default=None, no transf. if preprocess.method=manual, auto transf. if preprocess.method=auto), 
      ###              multiply_by(optional, default=1), 
      ###              clip_min(optional, default=-5), 
      ###              clip_max(optional, default=5), 
      ###              pad_value(optional, default=0)]
         - [fj_2_part_pt_log, 1.7, 0.7]
         - [fj_2_part_e_log, 2.0, 0.7]
         - [fj_2_part_logptrel, -4.7, 0.7]
         - [fj_2_part_logerel, -4.7, 0.7]
         - [fj_2_part_deltaR, 0.2, 4.0]
         - [fj_2_part_charge, null]
         - [fj_2_part_isChargedHadron, null]
         - [fj_2_part_isNeutralHadron, null]
         - [fj_2_part_isPhoton, null]
         - [fj_2_part_isElectron, null]
         - [fj_2_part_isMuon, null]
         - [fj_2_part_d0, null]
         - [fj_2_part_d0err, 0, 1, 0, 1]
         - [fj_2_part_dz, null]
         - [fj_2_part_dzerr, 0, 1, 0, 1]
         - [fj_2_part_deta, null]
         - [fj_2_part_dphi, null]
   fj_2_pf_vectors:
      length: 128
      pad_mode: wrap
      vars: 
         - [fj_2_part_px, null]
         - [fj_2_part_py, null]
         - [fj_2_part_pz, null]
         - [fj_2_part_energy, null]
   fj_2_pf_mask:
      length: 128
      pad_mode: constant
      vars: 
         - [fj_2_part_mask, null]

