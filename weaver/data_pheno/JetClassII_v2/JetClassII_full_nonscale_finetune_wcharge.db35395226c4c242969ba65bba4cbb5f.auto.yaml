  label_Xminus: (ak.fill_none(ak.firsts(aux_genpart_pid), -100) == -24)
  jet_label_index_wplus: np.argmax(np.stack([label_Xplus, label_Xminus, label_QCD],
    1), 1)
  truth_label: jet_label_index_wplus
